<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef7ff" />
    <meta name="description" content="小伊和球球的成长记录。做完就记一笔，让每一次努力离愿望更近一点。" />
    <title>小伊的成长星球</title>
    <link rel="icon" type="image/png" href="./assets/qiuqiu-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/qiuqiu-icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="小伊的星球" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./stage2.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="planet-scenery" aria-hidden="true"><span class="tiny-star star-one">✦</span><span class="tiny-star star-two">✧</span><span class="tiny-star star-three">✦</span><span class="orbit-planet"></span><span class="little-cloud"></span></div>
    <a href="#main" class="skip-link">跳到主要内容</a>
    <header class="site-header">
      <div class="header-inner">
        <a href="#record" class="brand" aria-label="小伊的成长星球首页">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>小伊的成长星球</span>
        </a>
        <nav aria-label="主要导航" id="navigation"></nav>
        <button type="button" id="manage-toggle" class="manage-toggle" aria-pressed="false">管理</button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer"><span class="storage-icon" aria-hidden="true">▣</span> 保存在此浏览器 <span class="footer-dot">·</span> 球球陪你，慢慢长大</footer>
    <div id="feedback" class="feedback" hidden><span id="feedback-message" role="status" aria-live="polite"></span><button type="button" id="undo-button" hidden>撤销</button><button type="button" id="dismiss-feedback" class="dismiss" aria-label="关闭提示">×</button></div>
    <dialog id="confirm-dialog" aria-labelledby="dialog-title"><form method="dialog"><span class="dialog-icon" aria-hidden="true">↶</span><h2 id="dialog-title">撤销这次记录？</h2><p id="dialog-description"></p><div class="dialog-actions"><button value="cancel" class="secondary-button">保留记录</button><button value="confirm" class="primary-button">确认撤销</button></div></form></dialog>
    <noscript><p class="noscript">请启用浏览器的 JavaScript，才能记录积分和保存成长记录。</p></noscript>
  </body>
</html>
